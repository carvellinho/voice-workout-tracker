name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Download & Extract Vosk Arabic Model
      run: |
        mkdir -p model
        echo "Downloading Vosk Arabic Model..."
        wget https://alphacephei.com/vosk/models/vosk-model-ar-mgb2-0.4.zip -O vosk-model.zip
        unzip vosk-model.zip
        # Move model contents into model directory
        cp -r vosk-model-ar-mgb2-0.4/* model/
        rm -rf vosk-model.zip vosk-model-ar-mgb2-0.4

    - name: Build with Buildozer
      uses: ArtemisSuns/buildozer-action@v1
      with:
        command: buildozer android debug
        submodule_parent: true

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v3
      with:
        name: VoiceWorkoutTracker-APK
        path: bin/*.apk
