name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libffi-dev libssl-dev ccache libltdl-dev
        # Fix Cython version compatibility for python-for-android
        pip install --upgrade "cython<3.0.0" buildozer

    - name: Auto-Accept Android SDK Licenses in buildozer.spec
      run: |
        if grep -q "android.accept_sdk_licenses" buildozer.spec; then
          sed -i 's/#\? \?android.accept_sdk_licenses =.*/android.accept_sdk_licenses = True/' buildozer.spec
        else
          echo "android.accept_sdk_licenses = True" >> buildozer.spec
        fi

    - name: Download & Extract Vosk Arabic Model
      run: |
        mkdir -p model
        echo "Downloading Vosk Arabic Model..."
        wget https://alphacephei.com/vosk/models/vosk-model-ar-mgb2-0.4.zip -O vosk-model.zip
        unzip vosk-model.zip
        cp -r vosk-model-ar-mgb2-0.4/* model/
        rm -rf vosk-model.zip vosk-model-ar-mgb2-0.4

    - name: Build APK with Buildozer
      run: |
        yes | buildozer android debug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: VoiceWorkoutTracker-APK
        path: bin/*.apk
